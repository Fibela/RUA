name: CI

# Dispara en la rama donde vive el codigo (master) y en cada PR.
# NOTA: la rama por defecto del repo debe ser 'master'. Mientras siga
# siendo 'Origen' (rama vacia), los PR y el badge apuntan a la rama
# equivocada: ese es exactamente PA-165 (CI vigilando una rama muerta).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux y Windows a proposito: PA-166 fue un fallo de compilacion
        # solo-Windows (termios sin cfg(unix)). Un solo runner no lo habria
        # visto. El workspace es logica pura (los tests del nucleo no
        # spawnean VBoxManage; orquestador usa mock), asi que corre en CI.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 @ 2026-07-16

      # Pinado a 1.97.0 a proposito: DEBE coincidir con rust-toolchain.toml.
      # Con @stable el CI formateaba con un rustfmt distinto al local y el
      # job de Formato salia rojo aunque el codigo estuviera bien: "verde en
      # un rustfmt" no es "verde en el otro".
      - name: Instalar toolchain 1.97.0 (coincide con rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache de cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 @ 2026-10-20

      - name: Formato (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Doctests
        run: cargo test --workspace --doc
