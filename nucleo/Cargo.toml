[package]
name = "rua-nucleo"
version = "0.1.0"
edition = "2021"
description = "Núcleo determinista de RUA: wrapper de VBoxManage expuesto como servidor MCP."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"

[[bin]]
name = "rua-nucleo"
path = "src/main.rs"
