[package]
name = "rua-sink"
version = "0.1.0"
edition = "2021"
description = "Colector local de syslog del laboratorio RUA: recibe los eventos del agente Eje-Latam (TCP en claro, RFC 6587 octet-counting, RFC 5424) y los almacena para la validación, sin depender de ASC en la nube."

[lib]
name = "rua_sink"
path = "src/lib.rs"

[[bin]]
name = "rua-sink"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
